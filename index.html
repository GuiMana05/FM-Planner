    function fileToText(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result || ''));
        r.onerror = () => reject(new Error('Falha a ler o ficheiro.'));
        r.readAsText(file, 'UTF-8');
      });
    }

    // ---- Mapeamento de posições FM -> categorias internas da app ----
    // Chaves internas: GR, DC, DD, DE, MDC, MC, ED, EE, PL
    const FM_POSITION_MAP = [
      [['GK'], 'GR'],
      [['DEF EC', 'DEF E'], 'DE'],
      [['DEF D'], 'DD'],
      [['MD'], 'MDC'],
      [['MC'], 'MC'],
      [['MA DEC', 'MA DE', 'MA E'], 'EE'],
      [['MA DDC', 'MA DC', 'MA D'], 'ED'],
      [['AVC', 'PL'], 'PL']
    ];
    // Ordenar por comprimento de código descendente para evitar que "MA D" capture "MA DC"/"MA DEC" primeiro.
    const FM_POSITION_LOOKUP = FM_POSITION_MAP
      .flatMap(([codes, cat]) => codes.map(code => ({ code, cat })))
      .sort((a, b) => b.code.length - a.code.length);

    function normalizeToken(text) {
      return String(text || '')
        .toUpperCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^A-Z0-9 ]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    // Nomes completos (como aparecem na app) mapeados diretamente para a categoria interna.
    // Isto tem prioridade sobre qualquer heurística de código curto, para nunca cair em
    // Defesa Central só porque a posição veio escrita por extenso.
    const FULL_LABEL_MAP = Object.keys(POSITION_CATEGORIES).reduce((acc, key) => {
      acc[normalizeToken(POSITION_CATEGORIES[key].label)] = key;
      return acc;
    }, {});
    // Variantes adicionais comuns (com/sem hífen, grafias alternativas) — normalizeToken já
    // remove acentos e pontuação, por isso cada variante só precisa de existir uma vez aqui.
    Object.assign(FULL_LABEL_MAP, {
      'GUARDA REDES': 'GR',
      'GUARDA REDE': 'GR',
      'DEFESA CENTRAL': 'DC',
      'DEFESA CENTRO': 'DC',
      'DEFESA DIREITO': 'DD',
      'DEFESA DIREITA': 'DD',
      'DEFESA ESQUERDO': 'DE',
      'DEFESA ESQUERDA': 'DE',
      'MEDIO DEFENSIVO': 'MDC',
      'MEDIO CENTRO': 'MC',
      'EXTREMO DIREITO': 'ED',
      'EXTREMO ESQUERDO': 'EE',
      'PONTA DE LANCA': 'PL'
    });

    function normalizePositionCode(text) {
      const t = normalizeToken(text);
      if (!t) return 'DC';
      if (CATEGORY_KEYS.includes(t)) return t;
      // 1) nome completo (a forma que a própria app usa, ou variante comum) — máxima prioridade
      if (FULL_LABEL_MAP[t]) return FULL_LABEL_MAP[t];
      // 2) match exato contra os códigos da FM (lista acima)
      const exact = FM_POSITION_LOOKUP.find(e => e.code === t);
      if (exact) return exact.cat;
      // 3) match por "contém", do código mais específico para o mais genérico
      const contains = FM_POSITION_LOOKUP.find(e => t.includes(e.code));
      if (contains) return contains.cat;

      if (/\bGR\b/.test(t)) return 'GR';

      // 4) heurísticas de código curto — só se aplicam a texto realmente curto (códigos FM),
      // nunca a frases completas, para não confundir palavras comuns (ex. "de") com códigos.
      const isShortCode = t.length <= 10 && t.split(' ').length <= 3;
      if (isShortCode) {
        // Deteção robusta de defesas: prioridade Direito > Esquerdo > Central.
        // Só cai em Defesa Central quando não há nenhum sinal de lateralidade.
        const isDefenderLike = /\bD\b|\bDEF\b|\bCB\b|\bRB\b|\bLB\b|\bWB\b|\bRWB\b|\bLWB\b|\bDC\b|\bDD\b|\bDE\b|\bBACK\b/.test(t);
        if (isDefenderLike) {
          if (/\bRB\b|\bRWB\b|\bWBR\b|\bDD\b|\bDR\b|DIREIT/.test(t)) return 'DD';
          if (/\bLB\b|\bLWB\b|\bWBL\b|\bDE\b|\bDL\b|ESQUERD/.test(t)) return 'DE';
          // Notação FM "D (R)", "D (L)", "D (RLC)", "D (C)" -> depois de normalizado fica "D R", "D RLC", etc.
          const tokens = t.split(' ').filter(Boolean);
          const suffix = tokens.slice(1).join('');
          if (suffix) {
            if (suffix.includes('R')) return 'DD';
            if (suffix.includes('L')) return 'DE';
            if (suffix.includes('C')) return 'DC';
          }
          return 'DC'; // defesa reconhecida mas verdadeiramente ambígua
        }
        if (/\bDM\b|\bMDC\b/.test(t)) return 'MDC';
        if (/\bAM\b|\bMOC\b/.test(t)) return 'MC';
        if (/\bRM\b|\bRW\b/.test(t)) return 'ED';
        if (/\bLM\b|\bLW\b|\bME\b/.test(t)) return 'EE';
        if (/\bCM\b/.test(t)) return 'MC';
        if (/\bSS\b|\bSA\b|\bST\b/.test(t)) return 'PL';
      }
      // 5) frases mais longas com palavras-chave reconhecíveis (ex. "Defesa lateral direito")
      if (/DIREIT/.test(t) && /DEFES|LATERAL/.test(t)) return 'DD';
      if (/ESQUERD/.test(t) && /DEFES|LATERAL/.test(t)) return 'DE';
      if (/CENTRAL/.test(t) && /DEFES/.test(t)) return 'DC';
      if (/DEFENSIV/.test(t) && /MEDI/.test(t)) return 'MDC';
      if (/CENTR/.test(t) && /MEDI/.test(t)) return 'MC';
      if (/DIREIT/.test(t) && /EXTREM/.test(t)) return 'ED';
      if (/ESQUERD/.test(t) && /EXTREM/.test(t)) return 'EE';
      if (/PONTA/.test(t) && /LANC/.test(t)) return 'PL';
      if (/GUARDA/.test(t) || /GUARD/.test(t)) return 'GR';

      // Verdadeiramente irreconhecível: mantém DC como último recurso, mas isto só deve
      // acontecer com texto que não corresponde a nenhuma posição conhecida.
      return 'DC';
    }

    // ---- Conversão de escala 0-200 -> 0-5 e limpeza de dinheiro ----
    function convertRatingToInternalScale(raw) {
      if (raw === null || raw === undefined || raw === '') return null;
      const n = Number(String(raw).replace(',', '.'));
      if (!Number.isFinite(n)) return null;
      // Já está na escala interna (0-5, ou 0-20 "estrelas"/"CA" antigo do FM em alguns exports)
      if (n <= 5) return clampRating(n);
      if (n <= 20) return clampRating(n / 4);
      // Escala clássica do FM (0-200)
      return clampRating(n / 40);
    }

    function parseMoneyToMillions(raw) {
      if (raw === null || raw === undefined || raw === '') return null;
      const s0 = String(raw).trim();
      if (!s0) return null;
      // Intervalo "92M € - 113M €" / "20-25M" / "900k a 1.2M": faz a média dos dois lados
      const rangeMatch = s0.match(/^(.+?)\s*(?:-|–|—|\bto\b|\ba\b)\s*(.+)$/i);
      if (rangeMatch && /\d/.test(rangeMatch[1]) && /\d/.test(rangeMatch[2])) {
        const a = parseSingleMoney(rangeMatch[1]);
        const b = parseSingleMoney(rangeMatch[2]);
        if (a !== null && b !== null) return clampMoney(Math.round(((a + b) / 2) * 100) / 100);
        if (a !== null) return a;
        if (b !== null) return b;
        return null;
      }
      return parseSingleMoney(s0);
    }

    function parseSingleMoney(raw) {
      if (raw === null || raw === undefined || raw === '') return null;
      let sOrig = String(raw).trim().replace(/[€$£]/g, '').trim();
      if (!sOrig) return null;
      let suffix = null;
      // 'm' minúsculo = mil (milhares); 'M' maiúsculo = milhões; 'k'/'K' = milhares
      if (/m$/.test(sOrig)) { suffix = 'k'; sOrig = sOrig.slice(0, -1); }
      else if (/M$/.test(sOrig)) { suffix = 'm'; sOrig = sOrig.slice(0, -1); }
      else if (/k$/i.test(sOrig)) { suffix = 'k'; sOrig = sOrig.slice(0, -1); }
      let s = sOrig.trim().toLowerCase();
      // formatos "1.234.567" (europeu) ou "1,234,567" (en) sem casas decimais explícitas
      if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
      else if (/^\d{1,3}(,\d{3})+$/.test(s)) s = s.replace(/,/g, '');
      else s = s.replace(',', '.');
      const n = Number(s);
      if (!Number.isFinite(n)) return null;
      let millions;
      if (suffix === 'm') millions = n; // já em milhões
      else if (suffix === 'k') millions = n / 1000; // milhares -> milhões
      else millions = n > 1000 ? n / 1000000 : n; // valor em unidades cheias -> milhões, senão já em milhões
      return clampMoney(Math.round(millions * 100) / 100);
    }

    function looksLikeMoneyCell(text) {
      if (!text) return false;
      const s = String(text).trim();
      if (!s) return false;
      return /[€$£]/.test(s) || /\d\s*[mk]\b/i.test(s) || /^\d+([.,]\d+)?\s*(-|–|—)\s*\d+([.,]\d+)?/.test(s);
    }

    function cleanPlayerName(raw) {
      return String(raw || '')
        .replace(/["']/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    // ---- Parser de CSV tolerante (vírgula, ponto e vírgula, tab, aspas) ----
    function detectDelimiter(sampleLine) {
      const candidates = [',', ';', '\t'];
      let best = ',', bestCount = -1;
      candidates.forEach(d => {
        const count = sampleLine.split(d).length;
        if (count > bestCount) { bestCount = count; best = d; }
      });
      return best;
    }

    function parseCsvLine(line, delimiter) {
      const out = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (inQuotes) {
          if (ch === '"') {
            if (line[i + 1] === '"') { cur += '"'; i++; }
            else inQuotes = false;
          } else cur += ch;
        } else if (ch === '"') {
          inQuotes = true;
        } else if (ch === delimiter) {
          out.push(cur);
          cur = '';
        } else {
          cur += ch;
        }
      }
      out.push(cur);
      return out.map(v => v.trim());
    }

    const HEADER_ALIASES = {
      name: ['nome', 'name', 'jogador', 'player'],
      position: ['posicao', 'posição', 'position', 'pos'],
      value: ['preco', 'preço', 'valor', 'price', 'value', 'valor estimado', 'preco estimado', 'preço estimado',
        'preco em milhoes', 'preço em milhões', 'valor de mercado', 'market value', 'transfer value',
        'transfer fee', 'custo', 'cost', 'valor m', 'preco m', 'valor euros', 'valor eur', '€', '€ m', '€m', '€(m)'],
      age: ['idade', 'age'],
      ca: ['ca', 'current ability'],
      pa: ['pa', 'potential ability']
    };
    const PRICE_HEADER_KEYWORDS = ['preco', 'valor', 'price', 'value', 'custo', 'cost', 'transfer', 'market', 'fee'];

    function detectPriceColumnIndex(headerCells) {
      const norm = headerCells.map(h => normalizeToken(h).toLowerCase());
      // 1) alias exato
      let idx = norm.findIndex(h => HEADER_ALIASES.value.some(alias => h === normalizeToken(alias).toLowerCase()));
      if (idx !== -1) return idx;
      // 2) o cabeçalho normalizado contém uma palavra-chave de preço
      idx = norm.findIndex(h => PRICE_HEADER_KEYWORDS.some(k => h.includes(k)));
      if (idx !== -1) return idx;
      // 3) sinais no texto original (antes de normalizar): símbolo de moeda, ou padrão "(M)"/"M€"
      idx = headerCells.findIndex(h => /[€$£]/.test(String(h)) || /\(\s*m\s*\)/i.test(String(h)) || /\bm\s*[€$£]?\s*$/i.test(String(h).trim()));
      if (idx !== -1) return idx;
      return -1;
    }

    function mapHeaderRow(headerCells) {
      const norm = headerCells.map(h => normalizeToken(h).toLowerCase());
      const mapping = {};
      Object.keys(HEADER_ALIASES).forEach(field => {
        if (field === 'value') return; // tratado à parte, com deteção mais tolerante
        const idx = norm.findIndex(h => HEADER_ALIASES[field].some(alias => h === normalizeToken(alias).toLowerCase()));
        if (idx !== -1) mapping[field] = idx;
      });
      const valueIdx = detectPriceColumnIndex(headerCells);
      if (valueIdx !== -1) mapping.value = valueIdx;
      return mapping;
    }

    function looksLikeHeaderRow(cells) {
      const norm = cells.map(c => normalizeToken(c).toLowerCase());
      return Object.keys(HEADER_ALIASES).some(field => HEADER_ALIASES[field].some(alias => norm.includes(normalizeToken(alias).toLowerCase())));
    }

    function parseCsvText(text) {
      const warnings = [];
      const clean = text.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const lines = clean.split('\n').map(l => l.trim()).filter(l => l.length);
      if (!lines.length) return { rows: [], warnings: ['O ficheiro está vazio.'] };

      const delimiter = detectDelimiter(lines[0]);
      const firstCells = parseCsvLine(lines[0], delimiter);
      let mapping, dataLines;
      if (looksLikeHeaderRow(firstCells)) {
        mapping = mapHeaderRow(firstCells);
        dataLines = lines.slice(1);
      } else {
        // sem cabeçalho reconhecível: assume ordem fixa Nome, Posição, Preço, Idade, CA, PA
        mapping = { name: 0, position: 1, value: 2, age: 3, ca: 4, pa: 5 };
        dataLines = lines;
        warnings.push('Não foi encontrado um cabeçalho reconhecível; assumi a ordem Nome, Posição, Preço, Idade, CA, PA.');
      }
      if (mapping.name === undefined) {
        warnings.push('Coluna "Nome" não identificada; a usar a primeira coluna como nome.');
        mapping.name = 0;
      }

      const rows = [];
      const byNormName = new Map();
      dataLines.forEach((line, i) => {
        if (!line) return;
        const cells = parseCsvLine(line, delimiter);
        const get = field => (mapping[field] !== undefined ? cells[mapping[field]] : undefined);
        const rawName = get('name');
        const name = cleanPlayerName(rawName);
        if (!name) {
          warnings.push('Linha ' + (i + 2) + ' ignorada: sem nome.');
          return;
        }
        const ageRaw = get('age');
        const age = ageRaw !== undefined && ageRaw !== '' && Number.isFinite(Number(ageRaw)) ? Math.round(Number(ageRaw)) : null;
        if (ageRaw !== undefined && ageRaw !== '' && age === null) warnings.push('Linha ' + (i + 2) + ' (' + name + '): idade inválida, ficou por preencher.');
        const caRaw = get('ca');
        const ca = convertRatingToInternalScale(caRaw);
        if (caRaw !== undefined && caRaw !== '' && ca === null) warnings.push('Linha ' + (i + 2) + ' (' + name + '): CA inválido.');
        const paRaw = get('pa');
        const pa = convertRatingToInternalScale(paRaw);
        if (paRaw !== undefined && paRaw !== '' && pa === null) warnings.push('Linha ' + (i + 2) + ' (' + name + '): PA inválido.');
        const valueRaw = mapping.value !== undefined
          ? get('value')
          : (() => {
              const usedIdx = new Set(Object.values(mapping));
              const candidate = cells.find((c, ci) => !usedIdx.has(ci) && looksLikeMoneyCell(c));
              return candidate;
            })();
        const value = parseMoneyToMillions(valueRaw);
        const position = normalizePositionCode(get('position'));

        const key = normalizeToken(name);
        if (byNormName.has(key)) {
          // duplicado dentro do próprio ficheiro: mantém a última ocorrência (mais recente/atualizada)
          const idx = byNormName.get(key);
          rows[idx] = { name, age, position, ca, pa, value };
          warnings.push('Nome duplicado no ficheiro (' + name + '): mantida a última linha.');
          return;
        }
        byNormName.set(key, rows.length);
        rows.push({ name, age, position, ca, pa, value });
      });

      fillMissingValuesWithEstimate(rows, warnings);

      return { rows, warnings };
    }

    const DEFAULT_VALUE_FALLBACK_M = 1; // fallback coerente quando não há qualquer preço no ficheiro

    function computeMedian(nums) {
      if (!nums.length) return null;
      const sorted = [...nums].sort((a, b) => a - b);
      const mid = Math.floor(sorted.length / 2);
      return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
    }

    function fillMissingValuesWithEstimate(rows, warnings) {
      const known = rows.map(r => r.value).filter(v => v !== null && v !== undefined && Number.isFinite(v));
      const median = computeMedian(known);
      const estimate = clampMoney(Math.round(((median !== null ? median : DEFAULT_VALUE_FALLBACK_M)) * 100) / 100);
      let filled = 0;
      rows.forEach(r => {
        if (r.value === null || r.value === undefined) {
          r.value = estimate;
          filled++;
        }
      });
      if (filled) {
        const basis = median !== null ? ('mediana dos ' + known.length + ' preço(s) reconhecido(s) ≈ ' + estimate.toFixed(1) + 'M') : ('sem nenhum preço no ficheiro; usado fallback padrão de ' + estimate.toFixed(1) + 'M');
        warnings.push(filled + ' jogador(es) sem preço no CSV: valor preenchido automaticamente (' + basis + '). Podes corrigir manualmente na tabela.');
      }
    }

    // ---- Matching de jogadores já existentes por nome ----
    function levenshteinDistance(a, b) {
      const m = a.length, n = b.length;
      if (!m) return n;
      if (!n) return m;
      let prev = Array.from({ length: n + 1 }, (_, j) => j);
      for (let i = 1; i <= m; i++) {
        const curr = [i];
        for (let j = 1; j <= n; j++) {
          curr[j] = a[i - 1] === b[j - 1] ? prev[j - 1] : 1 + Math.min(prev[j - 1], prev[j], curr[j - 1]);
        }
        prev = curr;
      }
      return prev[n];
    }
    function nameSimilarity(a, b) {
      const maxLen = Math.max(a.length, b.length);
      if (!maxLen) return 1;
      return 1 - levenshteinDistance(a, b) / maxLen;
    }
    function attachComparisonPasteListener() {
      if (window.__cvPasteHandler) return;
      window.__cvPasteHandler = (e) => {
        if (!state.comparisonPhotoModal) return;
        const items = (e.clipboardData && e.clipboardData.items) || [];
        let imageItem = null;
        for (let i = 0; i < items.length; i++) {
          if (items[i].type && items[i].type.startsWith('image/')) { imageItem = items[i]; break; }
        }
        if (!imageItem) { showToast('A área de transferência não contém uma imagem.', 'warn'); return; }
        e.preventDefault();
        setComparisonPhotoFile(imageItem.getAsFile());
      };
      document.addEventListener('paste', window.__cvPasteHandler);
    }
    function detachComparisonPasteListener() {
      if (window.__cvPasteHandler) {
        document.removeEventListener('paste', window.__cvPasteHandler);
        window.__cvPasteHandler = null;
      }
    }
    function setComparisonPhotoFile(file) {
      if (!file || !state.comparisonPhotoModal) return;
      if (state.comparisonPhotoModal.previewUrl) URL.revokeObjectURL(state.comparisonPhotoModal.previewUrl);
      state.comparisonPhotoModal.file = file;
      state.comparisonPhotoModal.previewUrl = URL.createObjectURL(file);
      renderModal();
    }
    function cancelComparisonPhotoModal() {
      detachComparisonPasteListener();
      if (state.comparisonPhotoModal && state.comparisonPhotoModal.previewUrl) URL.revokeObjectURL(state.comparisonPhotoModal.previewUrl);
      state.comparisonPhotoModal = null;
      renderModal();
    }
    async function confirmComparisonPhotoImport() {
      const modal = state.comparisonPhotoModal;
      if (!modal || !modal.file) { showToast('Escolhe um ficheiro ou cola uma imagem primeiro.', 'warn'); return; }
      detachComparisonPasteListener();
      const file = modal.file;
      const previewUrl = modal.previewUrl;
      state.comparisonPhotoModal = null;
      renderModal();
      await handleComparisonPhotoFile(file);
      if (previewUrl) URL.revokeObjectURL(previewUrl);
    }
    function renderComparisonPhotoModal(root) {
      const modal = state.comparisonPhotoModal;
      root.innerHTML = modalShell('Importar Foto · Comparação', '520px', `
        <div class="muted" style="margin-bottom:14px;line-height:1.6;">Escolhe um ficheiro ou cola uma captura de ecrã diretamente (Ctrl+V / Cmd+V).</div>
        <div style="display:flex;gap:8px;margin-bottom:14px;">
          <button class="btn btn-ghost" id="cvp-choose-file">${icon('plus')} Escolher ficheiro</button>
          <input type="file" id="cvp-file-input" accept="image/*" style="display:none;" />
        </div>
        <div id="cvp-paste-zone" tabindex="0" style="border:1px dashed var(--line);border-radius:12px;padding:${modal.previewUrl ? '10px' : '28px'};text-align:center;color:var(--muted);cursor:text;">
          ${modal.previewUrl
            ? `<img src="${modal.previewUrl}" style="max-width:100%;max-height:220px;border-radius:8px;display:block;margin:0 auto;" />`
            : `<div>Clica aqui e cola a imagem com <strong>Ctrl+V</strong> (ou Cmd+V)</div>`}
        </div>
        ${modal.file ? `<div class="faint" style="margin-top:8px;">Imagem pronta a analisar.</div>` : ''}
        <div class="modal-footer"><button class="btn btn-ghost" id="cvp-cancel">Cancelar</button><button class="btn btn-primary" id="cvp-analyze" ${modal.file ? '' : 'disabled'}>${icon('plus')} Analisar imagem</button></div>
      `);
      attachModalClose(root, cancelComparisonPhotoModal);
      root.querySelector('#cvp-cancel').onclick = cancelComparisonPhotoModal;
      root.querySelector('#cvp-analyze').onclick = confirmComparisonPhotoImport;
      root.querySelector('#cvp-choose-file').onclick = () => root.querySelector('#cvp-file-input').click();
      root.querySelector('#cvp-file-input').onchange = e => {
        const f = e.target.files && e.target.files[0];
        if (f) setComparisonPhotoFile(f);
      };
      const pasteZone = root.querySelector('#cvp-paste-zone');
      if (pasteZone) pasteZone.focus();
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
        reader.onerror = () => reject(new Error('Falha a ler o ficheiro.'));
        reader.readAsDataURL(file);
      });
    }

    // Encontra a linha de atributo do perfil atual que corresponde ao nome extraído da imagem:
    // 1) correspondência exata normalizada, 2) semelhança aproximada, 3) substring como último recurso.
    function matchComparisonAttribute(profile, extractedName) {
      const target = normalizeToken(extractedName);
      if (!target) return null;
      let attr = profile.attributes.find(a => normalizeToken(a.label) === target);
      if (attr) return attr;
      let best = null, bestScore = 0;
      profile.attributes.forEach(a => {
        const score = nameSimilarity(normalizeToken(a.label), target);
        if (score > bestScore) { bestScore = score; best = a; }
      });
      if (best && bestScore >= 0.8) return best;
      attr = profile.attributes.find(a => {
        const label = normalizeToken(a.label);
        return label.length > 3 && target.length > 3 && (label.includes(target) || target.includes(label));
      });
      return attr || null;
    }

    async function handleComparisonPhotoFile(file) {
      if (!file) return;
      const profile = comparisonActiveProfile();
      if (!profile || !profile.attributes.length) { showToast('O perfil atual ainda não tem atributos para preencher.', 'warn'); return; }
      showToast('A analisar a imagem com IA…', 'ok');
      try {
        const base64 = await fileToBase64(file);
        const mediaType = (file.type && file.type.startsWith('image/')) ? file.type : 'image/png';
        const promptText = 'Esta imagem é um ecrã de comparação de jogadores do Football Manager, com dois jogadores (A à esquerda, B à direita) e uma lista de atributos, cada um com o valor de A e o valor de B. Extrai TODOS os atributos visíveis com os respetivos valores numéricos. Responde APENAS com JSON válido, sem markdown nem texto adicional, no formato exato: {"jogadorA": "nome do jogador A ou null", "jogadorB": "nome do jogador B ou null", "atributos": [{"nome": "nome do atributo tal como aparece na imagem, em português", "a": numero, "b": numero}]}.';
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-6',
            max_tokens: 1500,
            messages: [{
              role: 'user',
              content: [
                { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
                { type: 'text', text: promptText }
              ]
            }]
          })
        });
        if (!response.ok) throw new Error('Erro da API (' + response.status + ')');
        const data = await response.json();
        const textBlock = (data.content || []).find(b => b.type === 'text');
        if (!textBlock || !textBlock.text) throw new Error('A resposta não contém texto.');
        const clean = textBlock.text.replace(/```json|```/g, '').trim();
        const parsed = JSON.parse(clean);
        const items = Array.isArray(parsed.atributos) ? parsed.atributos : [];
        if (!items.length) { showToast('Não foi possível identificar atributos na imagem.', 'warn'); return; }

        let matched = 0, unmatched = 0;
        items.forEach(item => {
          const attr = matchComparisonAttribute(profile, item.nome);
          if (!attr) { unmatched++; return; }
          if (!state.comparisonSession.values[attr.id]) state.comparisonSession.values[attr.id] = { a: '', b: '' };
          const a = Number(item.a), b = Number(item.b);
          if (Number.isFinite(a)) state.comparisonSession.values[attr.id].a = a;
          if (Number.isFinite(b)) state.comparisonSession.values[attr.id].b = b;
          matched++;
        });
        persistComparison();
        render();
        const names = [parsed.jogadorA, parsed.jogadorB].filter(Boolean).join(' vs ');
        showToast('Preenchidos ' + matched + ' atributos' + (names ? ' (' + names + ')' : '') + '.' + (unmatched ? ' ' + unmatched + ' não reconhecidos — preenche-os à mão.' : ''), 'ok');
      } catch (err) {
        showToast('Não foi possível analisar a imagem: ' + (err && err.message ? err.message : 'erro desconhecido'), 'warn');
      }
    }

    function findExistingPlayerMatches(extractedName) {
      const target = normalizeToken(extractedName);
      if (!target) return [];
      const exact = state.players.filter(p => normalizeToken(p.name) === target);
      if (exact.length) return exact;
      const fuzzy = state.players
        .map(p => ({ p, score: nameSimilarity(normalizeToken(p.name), target) }))
        .filter(x => x.score >= 0.8)
        .sort((a, b) => b.score - a.score);
      if (fuzzy.length) return fuzzy.map(x => x.p);
      // sem match exato/aproximado forte: sugere aproximações (substring) para escolha manual, sem pré-selecionar
      return state.players.filter(p => {
        const name = normalizeToken(p.name);
        return name.length > 3 && target.length > 3 && (name.includes(target) || target.includes(name));
      });
    }

    function renderToast() {
      const root = document.getElementById('toast-root');
      root.innerHTML = state.toast ? `<div class="toast" style="border-color:${state.toast.tone === 'warn' ? 'var(--red-2)' : 'var(--green-2)'}">${esc(state.toast.msg)}</div>` : '';
    }

    function renderFatal(error) {
      const app = document.getElementById('app');
      app.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;"><div style="max-width:720px;width:100%;background:#11161d;border:1px solid #25303b;border-radius:18px;padding:24px;color:#e7edf2;font-family:Inter,system-ui,sans-serif;"><h1 style="margin:0 0 12px;font:600 28px Oswald,Arial Narrow,sans-serif;letter-spacing:.03em;">FM Squad Planner</h1><p style="margin:0 0 12px;color:#99a5b3;line-height:1.6;">A app encontrou um erro ao arrancar. Isto costuma acontecer quando o preview bloqueia alguma API do browser ou quando houve um erro de JavaScript.</p><pre style="white-space:pre-wrap;word-break:break-word;background:#0b0f14;border:1px solid #25303b;border-radius:12px;padding:12px;color:#e08a84;overflow:auto;">' + esc(error && (error.stack || error.message) || String(error)) + '</pre></div></div>';
    }

    window.addEventListener('error', function(e) { renderFatal(e.error || e.message || 'Erro desconhecido'); });

    try {
      loadState();
      render();
    } catch (error) {
      renderFatal(error);
    }
  </script>
</body>
</html>
