<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FM Squad Planner</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #11161d;
      --panel-2: #161d25;
      --panel-3: #1a222c;
      --panel-4: #202a35;
      --line: #25303b;
      --line-soft: #1c252f;
      --text: #e7edf2;
      --muted: #99a5b3;
      --faint: #6f7b88;
      --green: #7fd39a;
      --green-2: #3f8a5c;
      --red: #e08a84;
      --red-2: #c0524a;
      --amber: #d4c86a;
      --amber-2: #8d8240;
      --blue: #7ca8ff;
      --chip: rgba(255,255,255,0.05);
      --shadow: 0 18px 48px rgba(0,0,0,0.35);
      --radius: 14px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; }
    body { min-height: 100vh; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line-soft);
      font-size: 13.5px;
      vertical-align: top;
    }
    tbody tr:hover td { background: rgba(255,255,255,0.02); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #2a3440; border-radius: 999px; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      background: radial-gradient(circle at top right, rgba(127,211,154,0.08), transparent 28%), var(--bg);
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px 18px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(10,14,19,0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 220px;
    }
    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: rgba(127,211,154,0.12);
      color: var(--green);
      border: 1px solid rgba(127,211,154,0.22);
      font-size: 17px;
    }
    .brand-text {
      font-family: Oswald, Arial Narrow, sans-serif;
      letter-spacing: .06em;
      font-size: 24px;
      line-height: 1;
    }
    .topbar-right {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }
    .selector-group {
      display: flex;
      align-items: end;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
    }
    .selector-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 180px;
    }
    .selector-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .shell {
      min-height: 0;
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      align-items: start;
    }
    .sidenav {
      border-right: 1px solid var(--line);
      padding: 18px 14px;
      background: rgba(14,19,24,0.82);
      position: sticky;
      top: var(--topbar-h, 74px);
      align-self: start;
      max-height: calc(100vh - var(--topbar-h, 74px));
      overflow-y: auto;
    }
    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      margin-bottom: 8px;
      text-align: left;
    }
    .nav-item.active {
      background: rgba(127,211,154,0.08);
      border-color: rgba(127,211,154,0.18);
      color: var(--text);
    }
    .nav-item .icon { width: 18px; text-align: center; }
    .main {
      padding: 20px;
      min-width: 0;
      align-self: start;
    }
    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .panel-body { padding: 18px; }
    .tab-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .tab-title {
      margin: 0;
      font-family: Oswald, Arial Narrow, sans-serif;
      font-size: 28px;
      letter-spacing: .03em;
      font-weight: 600;
    }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
    .import-table { width: 100%; min-width: 760px; table-layout: auto; }
    .squad-table { table-layout: fixed; min-width: 760px; }
    .squad-table th, .squad-table td { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .squad-table td:first-child, .squad-table th:first-child { white-space: normal; }
    .import-table th, .import-table td { white-space: nowrap; }
    .import-table .import-name { min-width: 170px; }
    .import-table .import-pos { min-width: 170px; }
    .import-table .import-age,
    .import-table .import-ca,
    .import-table .import-pa,
    .import-table .import-value {
      min-width: 76px;
      width: 76px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      padding-right: 10px;
    }
    .import-table .import-match, .import-table select.import-match { min-width: 220px; }
    .empty {
      display: grid;
      place-items: center;
      min-height: 220px;
      border: 1px dashed var(--line);
      border-radius: 16px;
      color: var(--muted);
      text-align: center;
      padding: 24px;
      background: rgba(255,255,255,0.015);
    }
    .pill, .type-tag {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      border: 1px solid var(--line);
      background: var(--chip);
      white-space: nowrap;
    }
    .type-tag.real { color: var(--green); border-color: rgba(127,211,154,0.24); background: rgba(127,211,154,0.12); }
    .type-tag.fictional { color: #d4a356; border-color: rgba(212,163,86,0.24); background: rgba(212,163,86,0.12); }
    .cmp { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
    .cmp.up { color: var(--green); }
    .cmp.down { color: var(--red); }
    .cmp.same { color: var(--amber); }
    .cmp.new { color: #ccd2d8; }
    .btn, .icon-btn, .select, .input, .textarea {
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      font-weight: 600;
    }
    .btn:hover, .icon-btn:hover { filter: brightness(1.08); }
    .btn-primary { background: rgba(127,211,154,0.13); border-color: rgba(127,211,154,0.3); color: var(--green); }
    .btn-danger { background: rgba(224,138,132,0.12); border-color: rgba(224,138,132,0.28); color: var(--red); }
    .btn-ghost { background: var(--panel-2); color: var(--text); }
    .icon-btn {
      width: 38px;
      height: 38px;
      display: inline-grid;
      place-items: center;
      padding: 0;
    }
    .select, .input, .textarea {
      width: 100%;
      padding: 10px 12px;
      outline: none;
    }
    .textarea { min-height: 90px; resize: vertical; }
    .select:focus, .input:focus, .textarea:focus, .btn:focus, .icon-btn:focus, .nav-item:focus {
      outline: 2px solid rgba(127,211,154,0.45);
      outline-offset: 2px;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .summary-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      padding: 14px;
    }
    .summary-card h3 {
      margin: 0 0 10px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .summary-card ul { margin: 0; padding-left: 18px; color: var(--muted); }
    .summary-card li { margin-bottom: 6px; }

    .kanban {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .kanban-col {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      min-height: 220px;
      display: flex;
      flex-direction: column;
    }
    .kanban-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .kanban-count {
      min-width: 24px;
      height: 24px;
      display: inline-grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      font-size: 11px;
    }
    .kanban-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .kanban-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-2);
      padding: 12px;
    }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }

    .pitch-wrap {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, #0f2816, #0d2012);
      padding: 18px;
      overflow: auto;
    }
    .pitch {
      position: relative;
      width: 100%;
      min-width: 720px;
      aspect-ratio: 0.68;
      border-radius: 18px;
      border: 2px solid rgba(255,255,255,0.18);
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.04), transparent 16%),
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)),
        repeating-linear-gradient(180deg, rgba(255,255,255,0.025) 0 9%, rgba(0,0,0,0.02) 9% 18%);
      margin: 0 auto;
      overflow: hidden;
    }
    .pitch-slot {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 124px;
      text-align: center;
    }
    .pitch-token {
      width: 58px;
      height: 58px;
      margin: 0 auto 8px;
      border-radius: 50%;
      border: 2px dashed rgba(255,255,255,0.22);
      display: grid;
      place-items: center;
      background: rgba(0,0,0,0.14);
      color: rgba(255,255,255,0.85);
      font-weight: 700;
    }
    .pitch-token.filled {
      border-style: solid;
      border-color: rgba(127,211,154,0.45);
      background: rgba(127,211,154,0.14);
      color: var(--green);
    }
    .pitch-slot button.clear-slot {
      margin-top: 6px;
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid rgba(224,138,132,0.25);
      background: rgba(224,138,132,0.1);
      color: var(--red);
    }
    .pitch-label { font-size: 11px; color: rgba(255,255,255,0.85); }
    .pitch-name { font-size: 11px; color: rgba(255,255,255,0.98); font-weight: 600; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4,8,12,0.76);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 100;
    }
    .modal {
      width: min(760px, 100%);
      max-height: min(90vh, 920px);
      overflow: auto;
      background: #10161d;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: #10161d;
      z-index: 2;
    }
    .modal-title { margin: 0; font-size: 20px; font-family: Oswald, Arial Narrow, sans-serif; letter-spacing: .03em; }
    .modal-body { padding: 18px; }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .field-wide { grid-column: 1 / -1; }
    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip-btn {
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--muted);
    }
    .chip-btn.active {
      color: var(--green);
      background: rgba(127,211,154,0.12);
      border-color: rgba(127,211,154,0.28);
    }
    .preset-list {
      margin: 12px 0 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 13px;
      max-height: 240px;
      overflow: auto;
    }
    .formation-btn {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      margin-bottom: 8px;
      text-align: left;
    }
    .custom-slot-grid { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .custom-slot-row { display: grid; grid-template-columns: 26px 1fr 160px; gap: 8px; align-items: center; }
    .picker-list { display: flex; flex-direction: column; gap: 8px; }
    .picker-label { margin: 12px 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .picker-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      text-align: left;
    }
    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 120;
      max-width: min(420px, calc(100vw - 36px));
      border: 1px solid var(--green-2);
      background: rgba(17,22,29,0.96);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
    }
    .hidden { display: none !important; }


    .inline-cell-btn {
      width: 100%;
      text-align: left;
      border: 1px dashed transparent;
      background: transparent;
      color: inherit;
      padding: 6px 8px;
      border-radius: 8px;
      min-height: 32px;
    }
    .inline-cell-btn:hover { border-color: var(--line); background: rgba(255,255,255,0.03); }
    .inline-number { font-variant-numeric: tabular-nums; }
    .campo-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .campo-tab {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--muted);
      text-align: left;
      transition: border-color .15s ease, background .15s ease, color .15s ease;
    }
    .campo-tab-title { font-family: Oswald, Arial Narrow, sans-serif; font-size: 16px; letter-spacing: .04em; }
    .campo-tab-count { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--faint); }
    .campo-tab.team-main.active { border-color: rgba(140,32,188,0.65); background: rgba(140,32,188,0.16); color: #f3e8ff; }
    .campo-tab.team-main.active .campo-tab-count { color: #e6c9ff; }
    .campo-tab.team-reserve.active { border-color: rgba(10,90,190,0.65); background: rgba(10,90,190,0.16); color: #d9eaff; }
    .campo-tab.team-reserve.active .campo-tab-count { color: #bfdcff; }
    .campo-tab:not(.active):hover { border-color: rgba(255,255,255,0.22); color: var(--text); }
    .pitch {
      position: relative;
      aspect-ratio: 1.62;
      width: 100%;
      max-width: 980px;
      min-width: 0;
      border-radius: 16px;
      background: linear-gradient(180deg, #123a1e, #0e2c17);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.18);
      margin: 0 auto;
    }
    .pitch::before,
    .pitch::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .pitch::before {
      border-left: 2px solid rgba(255,255,255,0.82);
      border-right: 2px solid rgba(255,255,255,0.82);
      border-top: 2px solid rgba(255,255,255,0.82);
      border-bottom: 2px solid rgba(255,255,255,0.82);
      border-radius: 16px;
    }
    .pitch::after {
      background:
        linear-gradient(90deg, transparent 49.85%, rgba(255,255,255,0.82) 49.85%, rgba(255,255,255,0.82) 50.15%, transparent 50.15%),
        radial-gradient(circle at 50% 50%, transparent 0 7.7%, rgba(255,255,255,0.82) 7.8% 8.05%, transparent 8.15%),
        linear-gradient(90deg, rgba(255,255,255,0.82), rgba(255,255,255,0.82)),
        linear-gradient(90deg, rgba(255,255,255,0.82), rgba(255,255,255,0.82)),
        linear-gradient(90deg, rgba(255,255,255,0.82), rgba(255,255,255,0.82)),
        linear-gradient(90deg, rgba(255,255,255,0.82), rgba(255,255,255,0.82));
      background-size: 
        100% 100%,
        100% 100%,
        15% 0.45%,
        15% 0.45%,
        15% 0.45%,
        15% 0.45%;
      background-position:
        center,
        center,
        0 18%,
        0 82%,
        100% 18%,
        100% 82%;
      background-repeat: no-repeat;
    }
    .pitch-box,
    .pitch-six,
    .pitch-spot,
    .pitch-arc {
      position: absolute;
      pointer-events: none;
      border-color: rgba(255,255,255,0.82);
    }
    .pitch-box.left { left: 0; top: 20%; width: 16%; height: 60%; border: 2px solid rgba(255,255,255,0.82); border-left: 0; }
    .pitch-box.right { right: 0; top: 20%; width: 16%; height: 60%; border: 2px solid rgba(255,255,255,0.82); border-right: 0; }
    .pitch-six.left { left: 0; top: 36%; width: 5.5%; height: 28%; border: 2px solid rgba(255,255,255,0.82); border-left: 0; }
    .pitch-six.right { right: 0; top: 36%; width: 5.5%; height: 28%; border: 2px solid rgba(255,255,255,0.82); border-right: 0; }
    .pitch-spot.left, .pitch-spot.right { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.92); top: 50%; transform: translateY(-50%); }
    .pitch-spot.left { left: 11%; }
    .pitch-spot.right { right: 11%; }
    .pitch-arc.left, .pitch-arc.right {
      width: 9%; height: 24%; top: 38%; border: 2px solid rgba(255,255,255,0.82); border-radius: 50%;
    }
    .pitch-arc.left { left: 11.2%; clip-path: inset(0 0 0 48%); }
    .pitch-arc.right { right: 11.2%; clip-path: inset(0 48% 0 0); }
    .pitch-slot {
      width: 176px;
      transform: translate(-50%, -50%);
    }
    .pitch-token {
      width: 176px;
      min-height: 48px;
      height: auto;
      border-radius: 12px;
      padding: 0;
      border: 1px dashed rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.14);
      overflow: hidden;
    }
    .pitch-token.filled {
      border-style: solid;
    }
    .pitch-token.filled.team-main {
      border-color: rgba(140,32,188,0.55);
      background: linear-gradient(160deg, rgba(140,32,188,0.62), rgba(90,18,132,0.78));
    }
    .pitch-token.filled.team-reserve {
      border-color: rgba(10,90,190,0.55);
      background: linear-gradient(160deg, rgba(10,90,190,0.62), rgba(8,58,136,0.78));
    }
    .pitch-token-inner {
      display:flex;
      flex-direction:column;
      width:100%;
      color: inherit;
      font-size: 10.5px;
      line-height: 1.25;
      text-align:left;
    }
    .pitch-row {
      display:flex;
      justify-content:space-between;
      gap:6px;
      align-items:center;
      padding: 4px 8px;
      font-weight: 600;
      font-size: 10px;
      color: #f5f2fb;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
    .pitch-row span { white-space: nowrap; }
    .pitch-row + .pitch-row {
      border-top: 1px solid rgba(255,255,255,0.14);
      font-weight: 600;

    function slot(label, category, x, y) { return { label, category, x, y }; }
    function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

    function clampRating(value) {

        return map[value] || (SEASON_ROLES.includes(value) ? value : 'Restantes');

    function readKey(key, fallback) { try { const raw = window.localStorage ? localStorage.getItem(key) : null; return raw ? JSON.parse(raw) : fallback; } catch { return fallback; } }

    function esc(str) { return String(str ?? "").replace(/[&<>\"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
    function initials(name) { return (name || '?').split(' ').filter(Boolean).slice(0,2).map(p => p[0]).join('').toUpperCase(); }
    function icon(name) {
      const map = {
        shield:'🛡', users:'👥', field:'🧩', compare:'⇄', board:'📋', star:'★', plus:'＋', edit:'✎', trash:'🗑', close:'✕', up:'↑', down:'↓', same:'—', spark:'✦', scout:'🔎'
      };

    const state = {

      recruits: [],

    function migratePlayerPosition(code) {
      const map = { LD: 'DD', LE: 'DE', MD: 'ED', ME: 'EE', EID: 'ED', EIE: 'EE', SA: 'PL', MOC: 'MC' };
      return POSITION_CATEGORIES[code] ? code : (map[code] || 'DC');
    }
    function migrateSlotCategory(code) {
      return migratePlayerPosition(code);
    }
    function ensureTacticCompatibility(tactic) {
      const assignments = tactic.assignments || {};
      const reserveAssignments = tactic.reserveAssignments || {};
      const slots = (tactic.slots || []).map((s, idx) => {
        const x = Number.isFinite(Number(s.x)) ? Number(s.x) : inferSlotCoords(tactic.formationKey, idx, s).x;

        return { ...s, category: migrateSlotCategory(s.category), x, y };
      });
      return { ...tactic, slots, assignments, reserveAssignments };
    }
    function inferSlotCoords(formationKey, idx, slotObj) {
      const preset = FORMATIONS[formationKey];
      if (preset && preset.slots[idx]) return { x: preset.slots[idx].x, y: preset.slots[idx].y };
      const fallback = [
        {x:8,y:50},{x:24,y:67},{x:22,y:50},{x:24,y:33},{x:28,y:86},{x:28,y:14},{x:46,y:50},{x:56,y:62},{x:56,y:38},{x:82,y:58},{x:82,y:42}
      ];
      return fallback[idx] || { x: 10 + idx * 7, y: 50 };
    }
    function loadState() {
      const core = readKey('fm-core', null);
      const stats = readKey('fm-season-stats', {});
      const tactics = readKey('fm-tactics', {});
      if (core && Array.isArray(core.seasons) && core.seasons.length) {
        state.seasons = core.seasons;
        state.players = Array.isArray(core.players) ? core.players.map(p => ({ ...p, mainPosition: migratePlayerPosition(p.mainPosition), secondaryPositions: (p.secondaryPositions || []).map(migratePlayerPosition).filter((v,i,a)=>a.indexOf(v)===i && v !== migratePlayerPosition(p.mainPosition)) })) : [];
        state.currentSeasonId = core.seasons[core.seasons.length - 1].id;
      } else {

      loadScoutsState();
      loadRecruitsState();

    function persistAll() {
      writeKey('fm-core', { seasons: state.seasons, players: state.players });

    }

    function loadScoutsState() {

        state.comparisonProfiles = raw.profiles.map(p => ({ id: p.id, name: p.name, attributes: Array.isArray(p.attributes) ? p.attributes.map(a => ({ id: a.id, label: a.label || '', multiplier: Number.isFinite(Number(a.multiplier)) ? Number(a.multiplier) : 1 })) : [] }));
        state.comparisonActiveProfileId = raw.activeProfileId && state.comparisonProfiles.find(p => p.id === raw.activeProfileId) ? raw.activeProfileId : state.comparisonProfiles[0].id;
        const migratedValues = {};
        Object.entries((raw.session && raw.session.values) || {}).forEach(([attrId, v]) => {
          if (v && typeof v === 'object') {

          } else if (v !== undefined && v !== null && v !== '' && Number(v) !== 0) {
            const n = Number(v);

        state.comparisonSession = { values: migratedValues };

        state.comparisonActiveProfileId = state.comparisonProfiles[0].id;
        state.comparisonSession = { values: {} };
      }

    function persistComparison() {
      writeKey('fm-comparison', { profiles: state.comparisonProfiles, activeProfileId: state.comparisonActiveProfileId, session: state.comparisonSession });
    }

    function comparisonActiveProfile() {
      return state.comparisonProfiles.find(p => p.id === state.comparisonActiveProfileId) || state.comparisonProfiles[0];
    }

    function switchComparisonProfile(profileId) {
      if (!state.comparisonProfiles.find(p => p.id === profileId)) return;
      state.comparisonActiveProfileId = profileId;
      state.comparisonSession = { values: {} };
      persistComparison();
      render();
    }

    function createComparisonProfile() {
      const input = document.getElementById('cv-new-profile-name');
      const name = input ? input.value.trim() : '';

      const profile = { id: uid(), name, attributes: [] };
      state.comparisonProfiles.push(profile);
      state.comparisonActiveProfileId = profile.id;
      state.comparisonSession = { values: {} };

      render();

    function deleteComparisonProfile() {
      if (state.comparisonProfiles.length <= 1) { showToast('Tem de existir pelo menos um perfil de comparação.'); return; }
      const profile = comparisonActiveProfile();
      state.confirmModal = {

    function addComparisonAttribute() {

    function removeComparisonAttribute(attrId) {

      render();

    function updateComparisonLabel(attrId, rawValue) {
      const profile = comparisonActiveProfile();

    function updateComparisonValue(attrId, side, rawValue) {
      if (!state.comparisonSession.values[attrId]) state.comparisonSession.values[attrId] = { a: '', b: '' };

      persistComparison();

    function updateComparisonMultiplier(attrId, rawValue) {
      const profile = comparisonActiveProfile();

      persistComparison();
      recomputeComparisonTotals();

    function comparisonRowTotal(attr) {
      const v = state.comparisonSession.values[attr.id] || {};
      const a = Number(v.a) || 0;
      const b = Number(v.b) || 0;
      const mult = Number(attr.multiplier);
      return (a - b) * (Number.isFinite(mult) ? mult : 0);
    }

    function comparisonGrandTotal() {
      const profile = comparisonActiveProfile();
      return profile.attributes.reduce((sum, attr) => sum + comparisonRowTotal(attr), 0);
    }

    function comparisonTotalA(profile) {
      const p = profile || comparisonActiveProfile();
      const session = state.comparisonSession;
      return p.attributes.reduce((sum, attr) => {
        const v = session.values[attr.id] || {};
        const a = Number(v.a) || 0;
        const mult = Number(attr.multiplier);
        return sum + a * (Number.isFinite(mult) ? mult : 0);
      }, 0);
    }

    function comparisonTotalB(profile) {
      const p = profile || comparisonActiveProfile();
      const session = state.comparisonSession;
      return p.attributes.reduce((sum, attr) => {
        const v = session.values[attr.id] || {};
        const b = Number(v.b) || 0;
        const mult = Number(attr.multiplier);
        return sum + b * (Number.isFinite(mult) ? mult : 0);
      }, 0);
    }

    function recomputeComparisonTotals() {
      const profile = comparisonActiveProfile();
      profile.attributes.forEach(attr => {
        const el = document.getElementById('cv-row-total-' + attr.id);
        if (el) el.textContent = comparisonRowTotal(attr).toFixed(1);
      });
      const totalEl = document.getElementById('cv-total');
      if (totalEl) totalEl.textContent = comparisonGrandTotal().toFixed(1);
      const totalAEl = document.getElementById('cv-total-a');
      if (totalAEl) totalAEl.textContent = comparisonTotalA(profile).toFixed(1);
      const totalBEl = document.getElementById('cv-total-b');
      if (totalBEl) totalBEl.textContent = comparisonTotalB(profile).toFixed(1);
    }

    function ensureCurrentTactic() {
      const list = tacticsThisSeason();
      if (list.length && !list.find(t => t.id === state.currentTacticId)) state.currentTacticId = list[0].id;
      if (!list.length) state.currentTacticId = null;
    }

    function currentSeason() { return state.seasons.find(s => s.id === state.currentSeasonId) || null; }
    function isCLMode() { const s = currentSeason(); return !!(s && s.clMode); }
    function activeSquadStatuses() { return isCLMode() ? SQUAD_STATUSES_CL : SQUAD_STATUSES; }
    function activeStatusField() { return isCLMode() ? 'clStatus' : 'squadStatus'; }
    function activeStatusValue(s) { return isCLMode() ? (s?.clStatus || 'Não Inscrito') : (s?.squadStatus || 'Fica'); }
    function previousSeason() {
      const cur = currentSeason();
      return cur ? state.seasons.find(s => s.id === cur.previousSeasonId) || null : null;
    }
    function currentStats() { return state.statsBySeason[state.currentSeasonId] || {}; }
    function previousStats() { const prev = previousSeason(); return prev ? (state.statsBySeason[prev.id] || {}) : {}; }
    function tacticsThisSeason() { return state.tacticsBySeason[state.currentSeasonId] || []; }
    function currentTactic() { return tacticsThisSeason().find(t => t.id === state.currentTacticId) || null; }
    function seasonPlayers() { const stats = currentStats(); return state.players.filter(p => stats[p.id]); }
    function seasonPlayersEligibleBase() {
      const stats = currentStats();
      return seasonPlayers().filter(p => {
        const status = (stats[p.id] || {}).squadStatus;
        return status !== 'Vendido' && status !== 'Emprestado';
      });
    }
    function seasonPlayersEligible() {
      const base = seasonPlayersEligibleBase();
      if (!isCLMode()) return base;
      const stats = currentStats();
      return base.filter(p => (stats[p.id] || {}).clStatus === 'Inscrito');
    }

    function showToast(msg, tone='ok') {
      state.toast = { msg, tone };
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => { state.toast = null; render(); }, 3200);
      render();
    }

    function isUnprocessedWarning(playerId, hasPrevious) {
      if (!hasPrevious) return false;

      if (!prev) return false;
      return cur.ca === prev.ca && cur.pa === prev.pa && cur.value === prev.value;
    }
    function compareField(playerId, field) {
      const cur = currentStats()[playerId];
      if (!cur) return { status: 'none' };

      if (cur.isNew || !prevMap[playerId]) return { status: 'new', cur: cur[field] };
      const prevVal = prevMap[playerId][field];
      const curVal = cur[field];
      if (prevVal === undefined || prevVal === null) return { status: 'new', cur: curVal };
      if (curVal > prevVal) return { status: 'up', cur: curVal, prev: prevVal };
      if (curVal < prevVal) return { status: 'down', cur: curVal, prev: prevVal };

    function openCreatePlayer() {
      state.playerModal = {
        mode: 'create',
        player: { id: uid(), name: '', type: 'real', mainPosition: 'DC', secondaryPositions: [], notes: '' },
        stats: { age: 20, ca: 1, pa: 1, value: 0, squadStatus: 'Fica', clStatus: 'Não Inscrito', seasonRole: 'Restantes', isNew: true }
      };
      render();
    }

    function openEditPlayer(playerId) {
      const p = state.players.find(x => x.id === playerId);
      if (!p) return;
      const stats = currentStats()[playerId] || { age:20, ca:1, pa:1, value:0, squadStatus:'Fica', clStatus:'Não Inscrito', seasonRole:'Restantes', isNew:false };
      state.playerModal = { mode: 'edit', player: structuredCloneSafe(p), stats: structuredCloneSafe(stats) };
      render();
    }

    function savePlayerFromModal() {
      const modal = state.playerModal;
      if (!modal) return;
      const player = modal.player;
      const stats = modal.stats;
      stats.ca = clampRating(stats.ca);
      stats.pa = clampRating(stats.pa);
      stats.value = clampMoney(stats.value);
      stats.squadStatus = normalizeLegacyValue('squadStatus', stats.squadStatus);
      stats.seasonRole = normalizeLegacyValue('seasonRole', stats.seasonRole);
      if (!player.name.trim()) return;
      const existingIndex = state.players.findIndex(p => p.id === player.id);
      if (existingIndex >= 0) state.players[existingIndex] = structuredCloneSafe(player);
      else state.players.push(structuredCloneSafe(player));
      state.statsBySeason[state.currentSeasonId] = state.statsBySeason[state.currentSeasonId] || {};
      state.statsBySeason[state.currentSeasonId][player.id] = structuredCloneSafe(stats);
      Object.keys(state.statsBySeason).forEach(sid => {
        Object.keys(state.statsBySeason[sid] || {}).forEach(pid => {
          const s = state.statsBySeason[sid][pid] || {};
          s.ca = clampRating(s.ca);
          s.pa = clampRating(s.pa);
          s.value = clampMoney(s.value);
          s.squadStatus = normalizeLegacyValue('squadStatus', s.squadStatus);
          s.seasonRole = normalizeLegacyValue('seasonRole', s.seasonRole);
          state.statsBySeason[sid][pid] = s;
        });
      });
      pruneTacticsForIneligiblePlayers();
      persistAll();
      state.playerModal = null;
      showToast((player.name || 'Jogador') + ' guardado.');
    }

    function requestDeletePlayer(playerId) {
      const p = state.players.find(x => x.id === playerId);
      if (!p) return;
      state.deleteModal = { playerId };
      render();
    }

    function confirmDelete(scope) {
      const p = state.players.find(x => x.id === state.deleteModal?.playerId);
      if (!p) return;
      if (scope === 'season') {
        if (state.statsBySeason[state.currentSeasonId]) delete state.statsBySeason[state.currentSeasonId][p.id];
        const list = tacticsThisSeason().map(t => {
          const assignments = { ...t.assignments };
          Object.keys(assignments).forEach(slotId => { if (assignments[slotId] === p.id) delete assignments[slotId]; });
          return { ...t, assignments };
        });
        state.tacticsBySeason[state.currentSeasonId] = list;
        Object.keys(state.statsBySeason).forEach(sid => {
        Object.keys(state.statsBySeason[sid] || {}).forEach(pid => {
          const s = state.statsBySeason[sid][pid] || {};
          s.ca = clampRating(s.ca);
          s.pa = clampRating(s.pa);
          s.value = clampMoney(s.value);
          s.squadStatus = normalizeLegacyValue('squadStatus', s.squadStatus);
          s.seasonRole = normalizeLegacyValue('seasonRole', s.seasonRole);
          state.statsBySeason[sid][pid] = s;
        });
      });
      persistAll();
        state.deleteModal = null;
        showToast(p.name + ' removido desta época.');
      } else {
        state.players = state.players.filter(pl => pl.id !== p.id);
        Object.keys(state.statsBySeason).forEach(sid => { if (state.statsBySeason[sid]) delete state.statsBySeason[sid][p.id]; });
        Object.keys(state.tacticsBySeason).forEach(sid => {
          state.tacticsBySeason[sid] = (state.tacticsBySeason[sid] || []).map(t => {
            const assignments = { ...t.assignments };
            Object.keys(assignments).forEach(slotId => { if (assignments[slotId] === p.id) delete assignments[slotId]; });
            return { ...t, assignments };
          });
        });
        Object.keys(state.statsBySeason).forEach(sid => {
        Object.keys(state.statsBySeason[sid] || {}).forEach(pid => {
          const s = state.statsBySeason[sid][pid] || {};
          s.ca = clampRating(s.ca);
          s.pa = clampRating(s.pa);
          s.value = clampMoney(s.value);
          s.squadStatus = normalizeLegacyValue('squadStatus', s.squadStatus);
          s.seasonRole = normalizeLegacyValue('seasonRole', s.seasonRole);
          state.statsBySeason[sid][pid] = s;
        });
      });
      persistAll();
        state.deleteModal = null;
        showToast(p.name + ' apagado definitivamente.', 'warn');
      }
    }

    function updateFieldForPlayer(playerId, field, value) {
      state.statsBySeason[state.currentSeasonId] = state.statsBySeason[state.currentSeasonId] || {};
      let v = value;
      if (field === 'ca' || field === 'pa') v = clampRating(value);
      if (field === 'value') v = clampMoney(value);
      if (field === 'squadStatus' || field === 'seasonRole') v = normalizeLegacyValue(field, value);
      if (field === 'age') v = Math.max(0, Number(value) || 0);
      state.statsBySeason[state.currentSeasonId][playerId] = { ...(state.statsBySeason[state.currentSeasonId][playerId] || {}), [field]: v };
      Object.keys(state.statsBySeason).forEach(sid => {
        Object.keys(state.statsBySeason[sid] || {}).forEach(pid => {
          const s = state.statsBySeason[sid][pid] || {};
          s.ca = clampRating(s.ca);
          s.pa = clampRating(s.pa);
          s.value = clampMoney(s.value);
          s.squadStatus = normalizeLegacyValue('squadStatus', s.squadStatus);
          s.seasonRole = normalizeLegacyValue('seasonRole', s.seasonRole);
          state.statsBySeason[sid][pid] = s;
        });
      });
      if (field === 'squadStatus' || field === 'clStatus') pruneTacticsForIneligiblePlayers();
      persistAll();
      render();
    }

    function createSeason(label) {
      const prevId = state.currentSeasonId;
      const newSeason = { id: uid(), label, previousSeasonId: prevId, clMode: false };
      state.seasons.push(newSeason);
      const prevStats = state.statsBySeason[prevId] || {};
      const inherited = {};
      Object.keys(prevStats).forEach(pid => {
        if (prevStats[pid].squadStatus === 'Vendido') return;
        const returningFromLoan = prevStats[pid].squadStatus === 'Emprestado';
        inherited[pid] = { ...prevStats[pid], age: (prevStats[pid].age || 0) + 1, isNew: false, squadStatus: returningFromLoan ? 'Fica' : prevStats[pid].squadStatus };
      });
      state.statsBySeason[newSeason.id] = inherited;
      const prevTactics = state.tacticsBySeason[prevId] || [];
      state.tacticsBySeason[newSeason.id] = prevTactics.map(t => ensureTacticCompatibility({ ...structuredCloneSafe(t), id: uid(), assignments: { ...(t.assignments || {}) }, reserveAssignments: { ...(t.reserveAssignments || {}) } }));
      state.currentSeasonId = newSeason.id;
      ensureCurrentTactic();
      Object.keys(state.statsBySeason).forEach(sid => {
        Object.keys(state.statsBySeason[sid] || {}).forEach(pid => {
          const s = state.statsBySeason[sid][pid] || {};
          s.ca = clampRating(s.ca);
          s.pa = clampRating(s.pa);
          s.value = clampMoney(s.value);
          s.squadStatus = normalizeLegacyValue('squadStatus', s.squadStatus);
          s.seasonRole = normalizeLegacyValue('seasonRole', s.seasonRole);
          state.statsBySeason[sid][pid] = s;
        });
      });
      persistAll();
      state.seasonModal = false;
      showToast('Época ' + label + ' criada — idades atualizadas (+1).');
    }

    function createTacticFromFormation(key, customName) {
      const preset = FORMATIONS[key];
      const tactic = { id: uid(), name: customName || preset.name, formationKey: key, slots: preset.slots.map(s => ({ id: uid(), label: s.label, category: s.category, x: s.x, y: s.y })), assignments: {}, reserveAssignments: {} };
      state.tacticsBySeason[state.currentSeasonId] = [...(state.tacticsBySeason[state.currentSeasonId] || []), tactic];
      state.currentTacticId = tactic.id;
      state.tacticModal = null;
      Object.keys(state.statsBySeason).forEach(sid => {
        Object.keys(state.statsBySeason[sid] || {}).forEach(pid => {
          const s = state.statsBySeason[sid][pid] || {};
          s.ca = clampRating(s.ca);
          s.pa = clampRating(s.pa);
          s.value = clampMoney(s.value);
          s.squadStatus = normalizeLegacyValue('squadStatus', s.squadStatus);
          s.seasonRole = normalizeLegacyValue('seasonRole', s.seasonRole);
          state.statsBySeason[sid][pid] = s;
        });
      });
      persistAll();
      showToast('Tática "' + tactic.name + '" criada com 11 posições.');
    }

    function updateTacticFromModal(tacticId, name, slotDrafts) {
      if (slotDrafts.length !== 11) return showToast('Uma tática tem de ter exatamente 11 posições.', 'warn');
      if (slotDrafts.some(s => !String(s.label || '').trim())) return showToast('Todas as posições precisam de um nome.', 'warn');
      const list = state.tacticsBySeason[state.currentSeasonId] || [];
      const idx = list.findIndex(t => t.id === tacticId);
      if (idx < 0) return;
      const existing = list[idx];
      const updatedSlots = existing.slots.map((s, i) => ({ ...s, label: slotDrafts[i].label, category: slotDrafts[i].category, x: Number(slotDrafts[i].x), y: Number(slotDrafts[i].y) }));
      list[idx] = { ...existing, name: name || existing.name, slots: updatedSlots };
      state.tacticModal = null;
      persistAll();
      showToast('Tática "' + list[idx].name + '" atualizada.');
      render();
    }

    function createCustomTactic(name, slotDrafts) {
      if (slotDrafts.length !== 11) return showToast('Uma tática tem de ter exatamente 11 posições.', 'warn');
      if (slotDrafts.some(s => !String(s.label || '').trim())) return showToast('Todas as posições precisam de um nome.', 'warn');
      const tactic = { id: uid(), name: name || 'Tática personalizada', formationKey: 'custom', slots: slotDrafts.map((s, i) => ({ id: uid(), label: s.label, category: s.category, x: Number(s.x), y: Number(s.y) })), assignments: {}, reserveAssignments: {} };
      state.tacticsBySeason[state.currentSeasonId] = [...(state.tacticsBySeason[state.currentSeasonId] || []), tactic];
      state.currentTacticId = tactic.id;
      state.tacticModal = null;
      Object.keys(state.statsBySeason).forEach(sid => {
        Object.keys(state.statsBySeason[sid] || {}).forEach(pid => {
          const s = state.statsBySeason[sid][pid] || {};
          s.ca = clampRating(s.ca);
          s.pa = clampRating(s.pa);
          s.value = clampMoney(s.value);
          s.squadStatus = normalizeLegacyValue('squadStatus', s.squadStatus);
          s.seasonRole = normalizeLegacyValue('seasonRole', s.seasonRole);
          state.statsBySeason[sid][pid] = s;
        });
      });
      persistAll();
      showToast('Tática "' + tactic.name + '" criada com 11 posições.');
    }

    function pruneTacticsForIneligiblePlayers() {
      const eligibleIds = new Set(seasonPlayersEligible().map(p => p.id));
      const list = state.tacticsBySeason[state.currentSeasonId] || [];
      state.tacticsBySeason[state.currentSeasonId] = list.map(t => {
        const assignments = { ...(t.assignments || {}) };
        const reserveAssignments = { ...(t.reserveAssignments || {}) };
        Object.keys(assignments).forEach(slotId => { if (assignments[slotId] && !eligibleIds.has(assignments[slotId])) delete assignments[slotId]; });
        Object.keys(reserveAssignments).forEach(slotId => { if (reserveAssignments[slotId] && !eligibleIds.has(reserveAssignments[slotId])) delete reserveAssignments[slotId]; });
        return { ...t, assignments, reserveAssignments };
      });
    }

    function assignPlayerToSlot(tacticId, slotId, playerId, team = 'main') {
      const list = state.tacticsBySeason[state.currentSeasonId] || [];
      const tacticBefore = list.find(t => t.id === tacticId);
      const key = team === 'reserve' ? 'reserveAssignments' : 'assignments';
      const prevPlayerId = tacticBefore ? (tacticBefore[key] || {})[slotId] : null;

      state.tacticsBySeason[state.currentSeasonId] = list.map(t => {
        if (t.id !== tacticId) return t;
        const assignments = { ...((t[key]) || {}) };
        if (playerId === null) delete assignments[slotId]; else assignments[slotId] = playerId;
        return { ...t, [key]: assignments }; 
      });

      state.statsBySeason[state.currentSeasonId] = state.statsBySeason[state.currentSeasonId] || {};
      const curStats = state.statsBySeason[state.currentSeasonId];
      if (prevPlayerId && prevPlayerId !== playerId) {
        curStats[prevPlayerId] = { ...(curStats[prevPlayerId] || {}), seasonRole: 'Restantes' };
      }
      if (playerId) {
        curStats[playerId] = { ...(curStats[playerId] || {}), seasonRole: team === 'reserve' ? 'Suplente' : 'Titular' };
      }

      Object.keys(state.statsBySeason).forEach(sid => {
        Object.keys(state.statsBySeason[sid] || {}).forEach(pid => {
          const s = state.statsBySeason[sid][pid] || {};
          s.ca = clampRating(s.ca);
          s.pa = clampRating(s.pa);
          s.value = clampMoney(s.value);
          s.squadStatus = normalizeLegacyValue('squadStatus', s.squadStatus);
          s.seasonRole = normalizeLegacyValue('seasonRole', s.seasonRole);
          state.statsBySeason[sid][pid] = s;
        });
      });
      persistAll();
      state.slotPicker = null;
      render();
    }

    function deleteTactic(tacticId) {
      state.tacticsBySeason[state.currentSeasonId] = (state.tacticsBySeason[state.currentSeasonId] || []).filter(t => t.id !== tacticId);
      ensureCurrentTactic();
      Object.keys(state.statsBySeason).forEach(sid => {
        Object.keys(state.statsBySeason[sid] || {}).forEach(pid => {
          const s = state.statsBySeason[sid][pid] || {};
          s.ca = clampRating(s.ca);
          s.pa = clampRating(s.pa);
          s.value = clampMoney(s.value);
          s.squadStatus = normalizeLegacyValue('squadStatus', s.squadStatus);
          s.seasonRole = normalizeLegacyValue('seasonRole', s.seasonRole);
          state.statsBySeason[sid][pid] = s;
        });
      });
      persistAll();
      showToast('Tática apagada.');
    }

    function deleteCurrentSeason(seasonId) {
      if (state.seasons.length <= 1) { showToast('Não é possível apagar a única época.'); return; }
      const idx = state.seasons.findIndex(s => s.id === seasonId);
      if (idx === -1) return;
      state.seasons = state.seasons.filter(s => s.id !== seasonId);
      delete state.statsBySeason[seasonId];
      delete state.tacticsBySeason[seasonId];
      state.seasons.forEach(s => { if (s.previousSeasonId === seasonId) s.previousSeasonId = null; });
      if (state.currentSeasonId === seasonId) {
        const fallback = state.seasons[idx - 1] || state.seasons[0];
        state.currentSeasonId = fallback ? fallback.id : null;
        state.currentTacticId = null;
        ensureCurrentTactic();
      }
      persistAll();
      showToast('Época apagada.');
    }

    function renderPitchSlots(tactic, players, team) {
      const assignments = team === 'reserve' ? (tactic.reserveAssignments || {}) : (tactic.assignments || {});
      const teamClass = team === 'reserve' ? 'team-reserve' : 'team-main';
      return tactic.slots.map(slotObj => {
        const playerId = assignments[slotObj.id] || null;
        const player = players.find(p => p.id === playerId);
        const s = player ? (currentStats()[player.id] || {}) : null;
        return `
          <div class="pitch-slot" style="left:${slotObj.x}%;top:${slotObj.y}%">
            <button class="pitch-token ${player ? 'filled ' + teamClass : ''}" data-slot-pick="${slotObj.id}" data-slot-team="${team}" title="Escolher jogador">
              ${player ? `<span class="pitch-token-inner"><span class="pitch-row"><span class="pitch-line-name">${esc(player.name)}</span><span class="pitch-line-rating">CA ${esc(clampRating(s.ca))} · PA ${esc(clampRating(s.pa))}</span></span><span class="pitch-row"><span>Price ${esc(formatValue(s.value))}M</span><span>Age ${esc(s.age ?? '—')}</span></span></span>` : `<span class="pitch-empty">+</span>`}
            </button>
            <div class="pitch-label">${esc(shortSlotLabel(slotObj.label, slotObj.category))}</div>
            ${player ? `<button class="clear-slot" data-slot-clear="${slotObj.id}" data-slot-team="${team}">Remover</button>` : ''}
          </div>
        `;
      }).join('');
    }

    function shortSlotLabel(label, category) {
      const map = {
        GR: 'GR',
        DC: 'D (C)',
        DD: 'D (D)',
        DE: 'D (E)',
        MDC: 'MD',
        MC: 'M (C)',
        ED: 'MO (D)',
        EE: 'MO (E)',
        PL: 'PL (C)'
      };
      const lower = String(label || '').toLowerCase();
      if (category === 'DC' && lower.includes('direito')) return 'D (C)';
      if (category === 'DC' && lower.includes('esquerdo')) return 'D (C)';
      if (category === 'DD') return 'D (D)';
      if (category === 'DE') return 'D (E)';
      if (category === 'ED') return 'MO (D)';
      if (category === 'EE') return 'MO (E)';
      return map[category] || label;
    }

    function renderComparacao(players, prevSeason) {
      if (!prevSeason) {
        return `
          <div class="tab-header"><h2 class="tab-title">Evolução</h2></div>
          <div class="empty"><div><div style="font-size:28px;margin-bottom:8px;">${icon('compare')}</div><div>Esta é a primeira época registada. Ainda não há época anterior para comparar.</div></div></div>
        `;
      }
      const rises = [], drops = [], news = [];
      players.forEach(p => {
        const ca = compareField(p.id, 'ca');
        if (ca.status === 'new') news.push(p.name);
        else if (ca.status === 'up') rises.push({ name: p.name, delta: (ca.cur - ca.prev) });
        else if (ca.status === 'down') drops.push({ name: p.name, delta: (ca.prev - ca.cur) });
      });
      rises.sort((a,b) => b.delta - a.delta);
      drops.sort((a,b) => b.delta - a.delta);
      return `
        <div class="tab-header"><h2 class="tab-title">Evolução vs. época ${esc(prevSeason.label)}</h2></div>
        <div class="summary-grid">
          ${summaryCard('Maiores subidas CA', 'var(--green)', rises.slice(0,5).map(r => `${esc(r.name)} (+${r.delta.toFixed(1)})`))}
          ${summaryCard('Maiores descidas CA', 'var(--red)', drops.slice(0,5).map(r => `${esc(r.name)} (-${r.delta.toFixed(1)})`))}

    function renderGroupedSquad(players, curStats, hasPrevious) {
      const groups = CATEGORY_KEYS.map(k => ({ key:k, label: POSITION_CATEGORIES[k].label, players: players.filter(p => p.mainPosition === k) })).filter(g => g.players.length);
      if (!groups.length) return `<div class="empty"><div><div style="font-size:28px;margin-bottom:8px;">${icon('users')}</div><div>Ainda não há jogadores nesta época.</div></div></div>`;
      return groups.map(g => {
        const sorted = g.players.slice().sort((a,b) => sortSquadPlayer(a,b,curStats));
        return `<section style="margin-bottom:16px;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 8px;">
            <h3 style="margin:0;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);">${esc(g.label)} <span style="color:var(--faint);font-weight:500;">(${sorted.length})</span></h3>
          </div>
          <div class="table-wrap">
            <table class="squad-table">
              <colgroup>
                <col style="width:20%" />
                <col style="width:11%" />
                <col style="width:7%" />
                <col style="width:7%" />
                <col style="width:7%" />
                <col style="width:9%" />
                <col style="width:8%" />
                <col style="width:13%" />
                <col style="width:13%" />
                <col style="width:68px" />
              </colgroup>
              <thead><tr><th>Nome</th><th>Posição</th><th>Idade</th><th>CA</th><th>PA</th><th>€ (M)</th><th>RH</th><th>Estado</th><th>Papel</th><th></th></tr></thead>
              <tbody>
                ${sorted.map(p => renderSquadRow(p, curStats[p.id] || {}, hasPrevious)).join('')}
              </tbody>
            </table>
          </div>
        </section>`;
      }).join('');
    }

    function sortSquadPlayer(a,b,curStats){
      const sa = curStats[a.id] || {}, sb = curStats[b.id] || {};
      return (sb.ca||0)-(sa.ca||0) || (sb.pa||0)-(sa.pa||0) || (sb.value||0)-(sa.value||0) || (sa.age||99)-(sb.age||99) || String(a.name).localeCompare(String(b.name), 'pt');
    }

    function renderSquadRow(p,s,hasPrevious){
      const unprocessed = isUnprocessedWarning(p.id, hasPrevious);
      return `<tr>
        <td><strong>${esc(p.name)}</strong>${unprocessed ? ` <span title="CA, PA e Preço iguais à época anterior — pode não ter sido processado" style="color:var(--red);font-weight:800;">!</span>` : ''}</td>
        <td>${esc(POSITION_CATEGORIES[p.mainPosition]?.label || p.mainPosition)}</td>
        <td>${esc(s.age ?? '')}</td>
        <td>${cmpCell(s.ca, hasPrevious ? compareField(p.id, 'ca') : null)}</td>
        <td>${cmpCell(s.pa, hasPrevious ? compareField(p.id, 'pa') : null)}</td>
        <td>${cmpCell(formatValue(s.value), hasPrevious ? compareField(p.id, 'value') : null)}</td>
        <td>${s.rh !== undefined && s.rh !== null && s.rh !== '' ? esc(formatValue(s.rh)) : '<span class="faint">—</span>'}</td>
        <td><select class="select board-select" data-player-id="${p.id}" data-field="${activeStatusField()}" style="min-width:0;">${activeSquadStatuses().map(opt => `<option value="${esc(opt)}" ${activeStatusValue(s) === opt ? 'selected' : ''}>${esc(opt)}</option>`).join('')}</select></td>
        <td><select class="select board-select" data-player-id="${p.id}" data-field="seasonRole" style="min-width:0;">${SEASON_ROLES.map(opt => `<option value="${esc(opt)}" ${(s.seasonRole || 'Restantes') === opt ? 'selected' : ''}>${esc(opt)}</option>`).join('')}</select></td>
        <td>
          <div style="display:flex;gap:6px;">
            <button class="icon-btn edit-player" data-player-id="${p.id}" title="Editar">${icon('edit')}</button>
            <button class="icon-btn delete-player" data-player-id="${p.id}" title="Apagar" style="color:var(--red)">${icon('trash')}</button>
          </div>
        </td>
      </tr>`;
    }
    function renderBoard(title, categories, field, players, curStats) {
      return `
        <div class="tab-header"><h2 class="tab-title">${title}</h2></div>
        <div class="kanban">
          ${categories.map(cat => {
            const inCat = players.filter(p => (curStats[p.id]?.[field] || categories[0]) === cat);
            return `<div class="kanban-col">
              <div class="kanban-head"><span>${esc(cat)}</span><span class="kanban-count">${inCat.length}</span></div>
              <div class="kanban-body">
                ${inCat.length ? inCat.map(p => `
                  <div class="kanban-card">
                    <div style="font-weight:700;margin-bottom:4px;">${esc(p.name)}</div>
                    <div class="faint" style="font-size:12px;margin-bottom:8px;">${esc(POSITION_CATEGORIES[p.mainPosition]?.label || p.mainPosition)}</div>
                    <select class="select board-select" data-player-id="${p.id}" data-field="${field}">
                      ${categories.map(opt => `<option value="${esc(opt)}" ${(curStats[p.id]?.[field] || categories[0]) === opt ? 'selected' : ''}>${esc(opt)}</option>`).join('')}
                    </select>
                  </div>`).join('') : `<div class="faint">Sem jogadores.</div>`}
              </div>
            </div>`;
          }).join('')}
        </div>
      `;
    }

    function summaryCard(title, color, items) {
      return `<div class="summary-card"><h3 style="color:${color}">${title}</h3>${items.length ? `<ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>` : `<div class="faint">Sem dados.</div>`}</div>`;
    }

    function pill(text) { return text ? `<span class="pill">${esc(text)}</span>` : '<span class="faint">—</span>'; }
    function formatValue(value) { return value === undefined || value === null || value === '' ? '' : Number(value).toFixed(1); }
    function averageSummaryForIds(ids) {
      const stats = currentStats();
      const rows = Array.from(ids).map(id => stats[id]).filter(Boolean);
      if (!rows.length) return null;
      const avg = key => rows.reduce((sum, s) => sum + (Number(s[key]) || 0), 0) / rows.length;
      return { count: rows.length, age: avg('age'), ca: avg('ca'), pa: avg('pa'), value: avg('value') };
    }
    function formatAverageLine(avgObj, emptyText) {
      if (!avgObj) return emptyText;
      return `Média (${avgObj.count}) · Idade ${avgObj.age.toFixed(1)} · CA ${avgObj.ca.toFixed(1)} · PA ${avgObj.pa.toFixed(1)} · Price ${avgObj.value.toFixed(1)}M`;
    }
    function formatValueRaw(value) { return value === undefined || value === null || value === '' ? '' : Number(value); }
    function cmpCell(value, cmp) {
      if (value === undefined || value === null || value === '') return '<span></span>';
      if (!cmp || cmp.status === 'none') return `<span>${esc(value)}</span>`;
      const iconChar = cmp.status === 'up' ? icon('up') : cmp.status === 'down' ? icon('down') : cmp.status === 'same' ? icon('same') : icon('spark');
      return `<span class="cmp ${cmp.status}">${esc(value)} <span>${iconChar}</span></span>`;
    }
    function scoreLR(label) {
      const l = String(label || '').toLowerCase();
      if (l.includes('esquerd')) return -1;
      if (l.includes('direit')) return 1;
      return 0;
    }

    function bindAppEvents() {
      document.querySelectorAll('[data-tab]').forEach(btn => btn.onclick = () => { state.tab = btn.dataset.tab; render(); });
      document.querySelectorAll('[data-campo-view]').forEach(btn => btn.onclick = () => { state.campoView = btn.dataset.campoView; render(); });
      document.getElementById('season-select').onchange = e => { state.currentSeasonId = e.target.value; ensureCurrentTactic(); render(); };
      const clModeSelect = document.getElementById('cl-mode-select');
      if (clModeSelect) clModeSelect.onchange = e => {
        const s = currentSeason();
        if (!s) return;
        s.clMode = e.target.value === 'sim';
        state.filterStatus = '';
        pruneTacticsForIneligiblePlayers();
        persistAll();
        render();
      };
      document.getElementById('tactic-select').onchange = e => { state.currentTacticId = e.target.value || null; render(); };
      document.getElementById('new-season-btn').onclick = () => { state.seasonModal = true; renderModal(); };
      document.getElementById('delete-season-btn').onclick = () => {
        const s = state.seasons.find(x => x.id === state.currentSeasonId);
        if (!s) return;
        if (state.seasons.length <= 1) { showToast('Não é possível apagar a única época.'); return; }
        state.confirmModal = {
          title: 'Apagar época',
          message: `Vais apagar a época <strong>${esc(s.label)}</strong> e todas as estatísticas e táticas associadas a ela. Esta ação não pode ser desfeita.`,
          confirmLabel: 'Apagar época',
          onConfirm: () => deleteCurrentSeason(s.id)
        };
        renderModal();
      };
      const deleteTacticTopbarBtn = document.getElementById('delete-tactic-topbar-btn');
      if (deleteTacticTopbarBtn) deleteTacticTopbarBtn.onclick = () => {
        const t = currentTactic();
        if (!t) return;
        state.confirmModal = {
          title: 'Apagar tática',
          message: `Vais apagar a tática <strong>${esc(t.name)}</strong> desta época. Esta ação não pode ser desfeita.`,
          confirmLabel: 'Apagar tática',
          onConfirm: () => deleteTactic(t.id)
        };
        renderModal();
      };
      document.getElementById('new-tactic-btn').onclick = () => { state.tacticModal = { mode: 'choose', presetKey: '4-4-2', customName: '', slots: Array.from({length:11}, () => ({ label:'', category:'MC' })) }; renderModal(); };

      const filter = document.getElementById('filter-pos');
      if (filter) filter.onchange = e => { state.filterPos = e.target.value; render(); };
      const filterStatus = document.getElementById('filter-status');
      if (filterStatus) filterStatus.onchange = e => { state.filterStatus = e.target.value; render(); };
      const importPlayers = document.getElementById('import-players-btn');
      if (importPlayers) importPlayers.onclick = () => { state.importModal = { status:'idle', rows: [], fileName: '', warnings: [] }; renderModal(); };
      const newPlayer = document.getElementById('new-player-btn');
      if (newPlayer) newPlayer.onclick = openCreatePlayer;
      const emptyNewTactic = document.getElementById('empty-new-tactic');
      if (emptyNewTactic) emptyNewTactic.onclick = () => { state.tacticModal = { mode: 'choose', presetKey: '4-4-2', customName: '', slots: Array.from({length:11}, () => ({ label:'', category:'MC' })) }; renderModal(); };
      const showRemainingBtn = document.getElementById('show-remaining-btn');
      if (showRemainingBtn) showRemainingBtn.onclick = () => { state.remainingModal = true; renderModal(); };
      const editTacticBtn = document.getElementById('edit-tactic-btn');
      if (editTacticBtn) editTacticBtn.onclick = () => {
        const t = currentTactic();
        if (!t) return;
        state.tacticModal = { mode: 'edit', tacticId: t.id, customName: t.name, slots: t.slots.map(s => ({ label: s.label, category: s.category, x: s.x, y: s.y })) };
        renderModal();
      };
      const deleteTacticBtn = document.getElementById('delete-tactic-btn');
      if (deleteTacticBtn) deleteTacticBtn.onclick = () => {
        const t = currentTactic();
        if (!t) return;
        state.confirmModal = {
          title: 'Apagar tática',
          message: `Vais apagar a tática <strong>${esc(t.name)}</strong> desta época. Esta ação não pode ser desfeita.`,
          confirmLabel: 'Apagar tática',
          onConfirm: () => deleteTactic(t.id)
        };
        renderModal();
      };

      document.querySelectorAll('.edit-player').forEach(btn => btn.onclick = () => openEditPlayer(btn.dataset.playerId));
      document.querySelectorAll('.delete-player').forEach(btn => btn.onclick = () => requestDeletePlayer(btn.dataset.playerId));
      document.querySelectorAll('.board-select').forEach(sel => sel.onchange = () => updateFieldForPlayer(sel.dataset.playerId, sel.dataset.field, sel.value));

      const filterRegion = document.getElementById('filter-region');
      if (filterRegion) filterRegion.onchange = e => { state.filterRegion = e.target.value; render(); };
      const newScout = document.getElementById('new-scout-btn');
      if (newScout) newScout.onclick = openCreateScout;
      document.querySelectorAll('.edit-scout').forEach(btn => btn.onclick = () => openEditScout(btn.dataset.scoutId));
      document.querySelectorAll('.delete-scout').forEach(btn => btn.onclick = () => requestDeleteScout(btn.dataset.scoutId));
      document.querySelectorAll('.scout-region-select').forEach(sel => sel.onchange = () => {
        const s = state.scouts.find(x => x.id === sel.dataset.scoutId);
        if (!s) return;
        s.region = sel.value;
        persistScouts();
        render();
      });
      const filterRecruitPos = document.getElementById('filter-recruit-pos');
      if (filterRecruitPos) filterRecruitPos.onchange = e => { state.filterRecruitPos = e.target.value; render(); };
      const newRecruit = document.getElementById('new-recruit-btn');
      if (newRecruit) newRecruit.onclick = openCreateRecruit;
      document.querySelectorAll('.edit-recruit').forEach(btn => btn.onclick = () => openEditRecruit(btn.dataset.recruitId));
      document.querySelectorAll('.delete-recruit').forEach(btn => btn.onclick = () => requestDeleteRecruit(btn.dataset.recruitId));
      document.querySelectorAll('.inline-edit').forEach(btn => btn.onclick = () => {
        const field = btn.dataset.inlineField;
        const playerId = btn.dataset.playerId;
        const current = btn.dataset.value || '';
        if (btn.dataset.inlineType === 'select') {
          const options = field === 'squadStatus' ? activeSquadStatuses() : SEASON_ROLES;
          const next = prompt('Escolhe: ' + options.join(' | '), current);
          if (next && options.includes(next)) updateFieldForPlayer(playerId, field, next);
          return;
        }
        const hint = field === 'age' ? 'Novo valor' : 'Novo valor (0 a 5, passo 0.5 para CA/PA)';
        const next = prompt(hint, current);
        if (next === null || next === '') return;
        updateFieldForPlayer(playerId, field, next);
      });
      document.querySelectorAll('[data-slot-pick]').forEach(btn => btn.onclick = () => { const t = currentTactic(); if (!t) return; state.slotPicker = { tacticId: t.id, slotId: btn.dataset.slotPick, team: btn.dataset.slotTeam || 'main' }; renderModal(); });
      document.querySelectorAll('[data-slot-clear]').forEach(btn => btn.onclick = () => { const t = currentTactic(); if (!t) return; assignPlayerToSlot(t.id, btn.dataset.slotClear, null, btn.dataset.slotTeam || 'main'); });

      const cvProfileSelect = document.getElementById('cv-profile-select');
      if (cvProfileSelect) cvProfileSelect.onchange = e => switchComparisonProfile(e.target.value);
      const cvNewProfile = document.getElementById('cv-new-profile');
      if (cvNewProfile) cvNewProfile.onclick = createComparisonProfile;
      const cvDeleteProfile = document.getElementById('cv-delete-profile');
      if (cvDeleteProfile) cvDeleteProfile.onclick = deleteComparisonProfile;
      const cvImportPhotoBtn = document.getElementById('cv-import-photo-btn');
      if (cvImportPhotoBtn) cvImportPhotoBtn.onclick = () => {
        state.comparisonPhotoModal = { file: null, previewUrl: null };
        attachComparisonPasteListener();
        renderModal();
      };
      const cvAddAttr = document.getElementById('cv-add-attr');
      if (cvAddAttr) cvAddAttr.onclick = addComparisonAttribute;
      document.querySelectorAll('[data-remove-attr]').forEach(btn => btn.onclick = () => removeComparisonAttribute(btn.dataset.removeAttr));
      document.querySelectorAll('[data-cv-label]').forEach(inp => inp.oninput = () => updateComparisonLabel(inp.dataset.cvLabel, inp.value));
      document.querySelectorAll('[data-cv-a]').forEach(inp => inp.oninput = () => updateComparisonValue(inp.dataset.cvA, 'a', inp.value));
      document.querySelectorAll('[data-cv-b]').forEach(inp => inp.oninput = () => updateComparisonValue(inp.dataset.cvB, 'b', inp.value));
      document.querySelectorAll('[data-cv-mult]').forEach(inp => inp.oninput = () => updateComparisonMultiplier(inp.dataset.cvMult, inp.value));
    }

    function renderModal() {
      const root = document.getElementById('modal-root');
      root.innerHTML = '';
      if (state.playerModal) return renderPlayerModal(root);
      if (state.deleteModal) return renderDeleteModal(root);
      if (state.seasonModal) return renderSeasonModal(root);
      if (state.tacticModal) return renderTacticModal(root);
      if (state.confirmModal) return renderConfirmModal(root);
      if (state.scoutModal) return renderScoutModal(root);
      if (state.recruitModal) return renderRecruitModal(root);
      if (state.slotPicker) return renderSlotPickerModal(root);
      if (state.remainingModal) return renderRemainingModal(root);
      if (state.comparisonPhotoModal) return renderComparisonPhotoModal(root);
      if (state.importModal) return renderImportModal(root);
    }

    function modalShell(title, width='760px', bodyHtml='') {
      return `<div class="modal-overlay" id="modal-overlay"><div class="modal" style="width:min(${width},100%)"><div class="modal-head"><h3 class="modal-title">${title}</h3><button class="icon-btn" id="modal-close">${icon('close')}</button></div><div class="modal-body">${bodyHtml}</div></div></div>`;
    }

    function attachModalClose(root, onClose) {
      root.querySelector('#modal-overlay').onclick = e => { if (e.target.id === 'modal-overlay') onClose(); };
      root.querySelector('#modal-close').onclick = onClose;
    }

    function renderPlayerModal(root) {
      const m = state.playerModal;
      root.innerHTML = modalShell(m.mode === 'create' ? 'Novo jogador' : 'Editar jogador', '680px', `
        <div class="form-grid">
          <div class="field"><label>Nome</label><input class="input" id="pm-name" value="${esc(m.player.name)}" autofocus /></div>
          <div class="field"><label>Posição principal</label><select class="select" id="pm-main">${CATEGORY_KEYS.map(k => `<option value="${k}" ${m.player.mainPosition===k?'selected':''}>${POSITION_CATEGORIES[k].label}</option>`).join('')}</select></div>
          <div class="field"><label>Idade</label><input type="number" class="input" id="pm-age" value="${esc(m.stats.age)}" /></div>
          <div class="field"><label>Capacidade (CA)</label><input type="number" step="0.5" class="input" id="pm-ca" min="0" max="5" step="0.5" value="${esc(clampRating(m.stats.ca))}" /></div>
          <div class="field"><label>Potencial (PA)</label><input type="number" step="0.5" class="input" id="pm-pa" min="0" max="5" step="0.5" value="${esc(clampRating(m.stats.pa))}" /></div>
          <div class="field"><label>Preço / Valor (M)</label><input type="number" step="0.1" class="input" id="pm-value" value="${esc(m.stats.value)}" /></div>
          <div class="field"><label>RH (Real Hability, opcional)</label><input type="number" step="0.1" class="input" id="pm-rh" value="${esc(m.stats.rh ?? '')}" placeholder="—" /></div>
          <div class="field"><label>Estado do plantel</label><select class="select" id="pm-status">${activeSquadStatuses().map(s => `<option value="${esc(s)}" ${activeStatusValue(m.stats)===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
          <div class="field"><label>Papel da época</label><select class="select" id="pm-role">${SEASON_ROLES.map(s => `<option value="${esc(s)}" ${m.stats.seasonRole===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
          <div class="field field-wide"><label>Posições secundárias</label><div class="chip-row" id="pm-secondary">${CATEGORY_KEYS.filter(k => k !== m.player.mainPosition).map(k => `<button type="button" class="chip-btn ${m.player.secondaryPositions.includes(k)?'active':''}" data-secondary="${k}">${k}</button>`).join('')}</div></div>
          <div class="field field-wide"><label>Notas</label><textarea class="textarea" id="pm-notes">${esc(m.player.notes || '')}</textarea></div>
        </div>
        <div class="modal-footer"><button class="btn btn-ghost" id="pm-cancel">Cancelar</button><button class="btn btn-primary" id="pm-save">${icon('plus')} Guardar</button></div>
      `);
      attachModalClose(root, () => { state.playerModal = null; renderModal(); });
      root.querySelector('#pm-cancel').onclick = () => { state.playerModal = null; renderModal(); };
      root.querySelector('#pm-save').onclick = () => {
        const player = state.playerModal.player;
        const stats = state.playerModal.stats;
        player.name = root.querySelector('#pm-name').value.trim();
        player.mainPosition = root.querySelector('#pm-main').value;
        player.notes = root.querySelector('#pm-notes').value;
        stats.age = Number(root.querySelector('#pm-age').value || 0);
        stats.ca = clampRating(root.querySelector('#pm-ca').value || 0);
        stats.pa = clampRating(root.querySelector('#pm-pa').value || 0);
        stats.value = clampMoney(root.querySelector('#pm-value').value || 0);
        const rhRaw = root.querySelector('#pm-rh').value;
        stats.rh = rhRaw === '' ? undefined : Number(rhRaw);
        stats[activeStatusField()] = root.querySelector('#pm-status').value;
        stats.seasonRole = root.querySelector('#pm-role').value;
        stats.isNew = state.playerModal.mode === 'create' ? true : !!stats.isNew;
        savePlayerFromModal();
      };
      root.querySelector('#pm-main').onchange = e => {
        const player = state.playerModal.player;
        const stats = state.playerModal.stats;
        player.name = root.querySelector('#pm-name').value;
        player.notes = root.querySelector('#pm-notes').value;
        stats.age = root.querySelector('#pm-age').value;
        stats.ca = root.querySelector('#pm-ca').value;
        stats.pa = root.querySelector('#pm-pa').value;
        stats.value = root.querySelector('#pm-value').value;
        stats.rh = root.querySelector('#pm-rh').value;
        stats[activeStatusField()] = root.querySelector('#pm-status').value;
        stats.seasonRole = root.querySelector('#pm-role').value;
        player.mainPosition = e.target.value;
        player.secondaryPositions = player.secondaryPositions.filter(p => p !== e.target.value);
        renderPlayerModal(root);
      };
      root.querySelectorAll('[data-secondary]').forEach(btn => btn.onclick = () => {
        const key = btn.dataset.secondary;
        const arr = state.playerModal.player.secondaryPositions;
        const idx = arr.indexOf(key);
        if (idx >= 0) arr.splice(idx,1); else arr.push(key);
        btn.classList.toggle('active');
      });
    }

    function renderDeleteModal(root) {
      const p = state.players.find(x => x.id === state.deleteModal.playerId);
      const usedElsewhere = Object.keys(state.statsBySeason).filter(sid => sid !== state.currentSeasonId && state.statsBySeason[sid]?.[p.id]).length > 0;
      root.innerHTML = modalShell('Apagar jogador', '460px', `
        <p class="muted" style="line-height:1.6;">Vais apagar <strong>${esc(p.name)}</strong>. ${usedElsewhere ? 'Este jogador existe noutras épocas/táticas.' : 'Este jogador só existe nesta época.'}</p>
        <div class="modal-footer" style="justify-content:stretch;flex-direction:column;align-items:stretch;">
          <button class="btn btn-ghost" id="del-season">Remover apenas desta época/tática</button>
          <button class="btn btn-danger" id="del-all">Apagar definitivamente todas as épocas</button>
          <button class="btn btn-ghost" id="del-cancel">Cancelar</button>
        </div>
      `);
      attachModalClose(root, () => { state.deleteModal = null; renderModal(); });
      root.querySelector('#del-season').onclick = () => confirmDelete('season');
      root.querySelector('#del-all').onclick = () => confirmDelete('all');
      root.querySelector('#del-cancel').onclick = () => { state.deleteModal = null; renderModal(); };
    }

    function renderConfirmModal(root) {
      const c = state.confirmModal;
      root.innerHTML = modalShell(c.title, '440px', `
        <p class="muted" style="line-height:1.6;">${c.message}</p>
        <div class="modal-footer">
          <button class="btn btn-ghost" id="confirm-cancel">Cancelar</button>
          <button class="btn btn-danger" id="confirm-ok">${c.confirmLabel}</button>
        </div>
      `);
      attachModalClose(root, () => { state.confirmModal = null; renderModal(); });
      root.querySelector('#confirm-cancel').onclick = () => { state.confirmModal = null; renderModal(); };
      root.querySelector('#confirm-ok').onclick = () => {
        const action = c.onConfirm;
        state.confirmModal = null;
        action();
      };
    }

    function renderSeasonModal(root) {
      const last = state.seasons[state.seasons.length - 1]?.label || '25-26';
      const guess = guessSeasonLabel(last);
      root.innerHTML = modalShell('Nova época', '420px', `

      const m = String(lastLabel || '').match(/(\d+)\D+(\d+)/);

      const b = String(Number(m[2]) + 1).padStart(2,'0');
      return a + '-' + b;

    async function handleImportFile(file, root) {
      state.importModal = { ...state.importModal, status:'loading', rows: [], fileName: file.name, warnings: [] };
      renderImportModal(root);
      try {
        const text = await fileToText(file);
        const { rows, warnings } = parseCsvText(text);
        if (!rows.length) throw new Error('Sem jogadores reconhecidos no CSV. Confirma as colunas Nome, Posição, Preço, Idade, CA, PA.');
        const withMatches = rows.map(r => {
          const candidates = findExistingPlayerMatches(r.name || '');
          return { ...r, candidates, matchedPlayerId: candidates.length === 1 ? candidates[0].id : '' };
        });
        state.importModal = { status:'preview', rows: withMatches, warnings, fileName: file.name };
        renderImportModal(root);
        bindImportPreviewEvents(root);
      } catch (e) {
        console.error(e);
        state.importModal = { status:'error', rows: [], fileName: file.name, warnings: [], errorMsg: e && e.message ? e.message : 'Não foi possível ler este CSV.' };
        renderImportModal(root);
      }
    }

      root.querySelectorAll('.import-value').forEach(el => el.oninput = () => state.importModal.rows[Number(el.dataset.index)].value = el.value === '' ? null : Number(el.value));
      root.querySelectorAll('.import-match').forEach(el => el.onchange = () => state.importModal.rows[Number(el.dataset.index)].matchedPlayerId = el.value);

    function saveImportedRows(root) {
      const rows = (state.importModal?.rows || []).filter(r => String(r.name || '').trim());
      state.statsBySeason[state.currentSeasonId] = state.statsBySeason[state.currentSeasonId] || {};
      rows.forEach(row => {
        const matchId = row.matchedPlayerId || '';
        const playerId = matchId || uid();
        if (!matchId) {
          state.players.push({ id: playerId, name: row.name.trim(), type: 'real', mainPosition: row.position || 'DC', secondaryPositions: [], notes: '' });
        } else {
          const existing = state.players.find(p => p.id === matchId);
          if (existing) {
            existing.name = row.name.trim() || existing.name;
            existing.mainPosition = row.position || existing.mainPosition;
          }
        }
        const previousSeasonStats = state.statsBySeason[state.currentSeasonId][playerId] || {};
        state.statsBySeason[state.currentSeasonId][playerId] = {
          age: row.age ?? previousSeasonStats.age ?? 20,
          ca: clampRating(row.ca ?? previousSeasonStats.ca ?? 1),
          pa: clampRating(row.pa ?? previousSeasonStats.pa ?? 1),
          value: clampMoney(row.value ?? previousSeasonStats.value ?? 0),
          squadStatus: previousSeasonStats.squadStatus ?? 'Fica',
          clStatus: previousSeasonStats.clStatus ?? 'Não Inscrito',
          seasonRole: previousSeasonStats.seasonRole ?? 'Restantes',
          isNew: !matchId
        };
      });
      Object.keys(state.statsBySeason).forEach(sid => {
        Object.keys(state.statsBySeason[sid] || {}).forEach(pid => {
          const s = state.statsBySeason[sid][pid] || {};
          s.ca = clampRating(s.ca);
          s.pa = clampRating(s.pa);
          s.value = clampMoney(s.value);
          s.squadStatus = normalizeLegacyValue('squadStatus', s.squadStatus);
          s.seasonRole = normalizeLegacyValue('seasonRole', s.seasonRole);
          state.statsBySeason[sid][pid] = s;
        });
      });
      persistAll();
      const count = rows.length;
      state.importModal = null;
      render();
      showToast(count + ' jogador(es) importado(s).');
